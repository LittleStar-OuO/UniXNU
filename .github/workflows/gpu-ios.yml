name: GPU iOS userspace

# Builds the iOS GPU userspace stack on a macOS runner so no local Mac is
# needed. The first target is Turnip with the pinned Mesa source and recorded
# patches (a known-good reference for the same cross-build recipe); the PanVK
# configure probe records what the Mali backend still needs.

on:
  workflow_dispatch:
  push:
    branches: [ tb365fc-gpu-ci ]

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  userspace:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "Xcode not found: $(printf '%s ' /Applications/Xcode_*.app)"; exit 1; }
          brew install meson ninja glslang
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip install --quiet --upgrade pip meson

      - name: Mesa source at the pinned commit
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          pins = json.loads(Path('scripts/data/adreno-compiler-inputs.json').read_text())
          mesa = pins['mesa']
          src = Path('.cache/mesa-work')
          if not src.exists():
              clone = ['git', 'clone', '--filter=blob:none', '--no-checkout', mesa['repository'], str(src)]
              if subprocess.run(clone).returncode:
                  print('primary Mesa remote failed, using the mirror')
                  subprocess.run(['rm', '-rf', str(src)], check=True)
                  subprocess.run(['git', 'clone', '--filter=blob:none', '--no-checkout',
                                  mesa['mirror'], str(src)], check=True)
          sparse = list(dict.fromkeys(list(mesa['sparse_directories']) + ['src/panfrost']))
          subprocess.run(['git', '-C', str(src), 'sparse-checkout', 'init', '--cone'], check=True)
          subprocess.run(['git', '-C', str(src), 'sparse-checkout', 'set', *sparse], check=True)
          if subprocess.run(['git', '-C', str(src), 'checkout', mesa['commit']]).returncode:
              subprocess.run(['git', '-C', str(src), 'fetch', 'origin', mesa['commit']], check=True)
              subprocess.run(['git', '-C', str(src), 'checkout', mesa['commit']], check=True)
          for patch in pins['patches']:
              print('applying', patch)
              subprocess.run(['git', '-C', str(src), 'apply', patch], check=True)
          PY

      - name: Turnip iOS build
        run: python3 scripts/build-turnip-darwin.py --target ios

      - name: Upload Turnip iOS library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turnip-ios
          path: |
            build/mesa-tu-ios/src/freedreno/vulkan/libvulkan_freedreno.dylib
            build/mesa-tu-ios/builtin-build-profile.json

      - name: PanVK configure probe (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          .cache/mesa-venv/bin/meson setup build/mesa-panvk-ios .cache/mesa-work \
            --cross-file build/mesa-tu-ios.cross \
            -Dgallium-drivers= -Dvulkan-drivers=panfrost -Dplatforms=macos \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dopengl=false \
            -Dgles1=disabled -Dgles2=disabled -Dllvm=disabled -Dshared-glapi=disabled \
            -Dxmlconfig=disabled -Dshader-cache=disabled -Dtools= -Dbuild-tests=false \
            -Dvideo-codecs= -Dvulkan-layers= -Dbuildtype=release -Db_ndebug=true \
            2>&1 | tee build/panvk-configure.log

      - name: Upload PanVK configure log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panvk-configure-log
          path: build/panvk-configure.log
          if-no-files-found: warn
